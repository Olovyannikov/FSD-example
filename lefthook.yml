prepare-commit-msg:
  commands:
    commitzen:
      interactive: true
      run: pnpm exec cz --hook
      env:
        LEFTHOOK: 0

fsd:
  parallel: true
  commands:
    fsd:
      run: pnpm run lint:fsd

frontend:
  parallel: true
  commands:
    eslint:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm run lint:ts
    stylelint:
      glob: '*.{css}'
      run: pnpm run lint:css {staged_files}
    prettier:
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}
    solidarity:
      run: solidarity
    circular:
      run: pnpm run lint:circular
    unit-test:
      run: pnpm run test:unit

pre-commit:
  piped: true
  commands:
    fsd:
      priority: 1
      run: LEFTHOOK_QUIET=meta,success lefthook run fsd
    frontend:
      run: LEFTHOOK_QUIET=meta,success lefthook run frontend

commit-msg:
  parallel: true
  commands:
    lint-commit-msg:
      run: pnpm exec commitlint --edit $1